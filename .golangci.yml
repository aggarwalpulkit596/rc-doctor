version: "2"

# Mirrors RevenueCat/cli's setup: golangci-lint v2 with staticcheck configured
# like the standalone tool, plus the rest of golangci-lint's standard set.
linters:
  default: standard
  enable:
    - misspell
  settings:
    staticcheck:
      # The standalone staticcheck defaults: quickfix (QF*) checks and the
      # stylecheck checks it leaves off by default stay off.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012
        - -SA9003
    errcheck:
      # Output to stdout and stderr: a failed write has nowhere to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
    misspell:
      locale: US
  exclusions:
    paths:
      - testdata
